<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="/images/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/images/favicon.png">
<link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
<title>Page not found · Veziroglu Consulting</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root {
    --paper:#f6f4ef; --ink:#14181d; --navy:#1E3A5F; --navy-deep:#12233a;
    --gold:#b8860b; --gold-light:#d4a843; --muted:#6b6560; --warm:#4a453f;
    --serif:'Instrument Serif',Georgia,serif;
    --sans:'DM Sans',system-ui,sans-serif;
  }
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family:var(--sans); background:var(--paper); color:var(--ink);
    font-size:16px; line-height:1.65; -webkit-font-smoothing:antialiased;
    min-height:100vh; display:flex; flex-direction:column;
  }
  a { color:var(--gold); text-decoration:none; }

  nav {
    padding:1.4rem 3rem; display:flex; align-items:center;
    border-bottom:1px solid rgba(20,24,29,0.08);
  }
  .logo { display:inline-flex; align-items:stretch; gap:0.16rem; }
  .logo-v { font-family:var(--serif); color:var(--navy); font-size:3.15rem; line-height:1; display:flex; align-items:center; }
  .logo-stack { display:flex; flex-direction:column; justify-content:center; }
  .logo-name { font-family:var(--serif); font-size:1.2rem; letter-spacing:0.14em; color:var(--navy); line-height:1; white-space:nowrap; }
  .logo-rule { display:block; height:1.5px; background:var(--gold); margin-top:0.32rem; }
  .logo-sub { text-align:center; font-size:0.5rem; font-weight:600; letter-spacing:0.42em; color:#8a8079; margin-top:0.3rem; padding-left:0.42em; }

  main {
    flex:1; display:flex; align-items:center; justify-content:center;
    padding:5rem 3rem; text-align:center;
  }
  .inner { max-width:560px; }
  .eyebrow {
    display:inline-flex; align-items:center; gap:0.9rem; margin-bottom:1.75rem;
  }
  .eyebrow span:first-child, .eyebrow span:last-child {
    width:28px; height:1px; background:var(--gold);
  }
  .eyebrow-text {
    font-size:0.7rem; font-weight:600; letter-spacing:0.22em;
    text-transform:uppercase; color:var(--gold);
  }
  h1 {
    font-family:var(--serif); font-weight:400;
    font-size:clamp(2.2rem,5vw,3.2rem); line-height:1.1;
    letter-spacing:-0.02em; color:var(--navy-deep); margin-bottom:1.25rem;
  }
  h1 em { font-style:italic; color:var(--gold); }
  p { color:var(--warm); line-height:1.75; margin-bottom:2.5rem; }

  .links { display:flex; gap:0.75rem; justify-content:center; flex-wrap:wrap; }
  .btn {
    display:inline-flex; align-items:center; gap:0.5rem;
    font-size:0.78rem; font-weight:600; letter-spacing:0.1em;
    text-transform:uppercase; padding:0.85rem 1.5rem; border-radius:3px;
    transition:background .25s, color .25s, border-color .25s;
  }
  .btn-solid { background:var(--navy-deep); color:var(--paper); border:1px solid var(--navy-deep); }
  .btn-solid:hover { background:var(--navy); border-color:var(--navy); color:var(--paper); }
  .btn-outline { border:1px solid rgba(20,24,29,0.2); color:var(--ink); }
  .btn-outline:hover { border-color:var(--navy-deep); color:var(--navy-deep); }

  footer {
    background:var(--ink); color:rgba(246,244,239,0.4);
    padding:2.25rem 3rem; text-align:center; font-size:0.75rem;
  }

  @media (max-width:640px) {
    nav { padding:1.1rem 1.5rem; }
    main { padding:3.5rem 1.5rem; }
    footer { padding:2rem 1.5rem; }
  }
</style>
</head>
<body>

  <nav>
    <a href="/" class="logo" aria-label="Veziroglu Consulting — home">
      <span class="logo-v">V</span>
      <span class="logo-stack">
        <span class="logo-name">EZIROGLU</span>
        <span class="logo-rule"></span>
        <span class="logo-sub">CONSULTING</span>
      </span>
    </a>
  </nav>

  <main>
    <div class="inner">
      <div class="eyebrow">
        <span></span>
        <span class="eyebrow-text">Error 404</span>
        <span></span>
      </div>
      <h1>This page <em>doesn't exist</em></h1>
      <p>The page you're looking for may have moved, or the link that brought you here may be out of date.</p>
      <div class="links">
        <a href="/" class="btn btn-solid">Back to home</a>
        <a href="/#work" class="btn btn-outline">Case studies</a>
        <a href="/#contact" class="btn btn-outline">Get in touch</a>
      </div>
    </div>
  </main>

  <footer>© 2026 Veziroglu Consulting Ltd. All rights reserved.</footer>

</body>
</html>
